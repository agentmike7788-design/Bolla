<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Bolla Fabrik</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <header class="hud hud-top">
        <h1>Bolla Fabrik</h1>
        <p class="seed">Karte <span id="seed"></span> <button id="new-map" type="button">Neue Karte</button></p>
      </header>
      <aside class="hud hud-info" id="tile-info" aria-live="polite">
        <p class="label">Feld</p>
        <p class="value" id="tile-name">Maus über die Karte bewegen</p>
        <p class="detail" id="tile-detail"></p>
      </aside>
      <aside class="hud hud-goal" id="goal" aria-live="polite"></aside>
      <aside class="hud hud-store">
        <p class="label">Lager</p>
        <ul id="store"></ul>
      </aside>
      <aside class="hud hud-legend">
        <p class="label">Erzvorkommen</p>
        <ul id="legend"></ul>
      </aside>
      <nav class="hud hud-tools" aria-label="Bauen">
        <button type="button" class="tool" data-tool="drill" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-3H5zM7 17V9h10v8M12 9V3M8 5h8" /></svg>
          <span>Bohrer</span><kbd>1</kbd>
        </button>
        <button type="button" class="tool" data-tool="belt" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h18v8H3zM7 14l3-2-3-2M12 14l3-2-3-2" /></svg>
          <span>Band</span><kbd>2</kbd>
        </button>
        <button type="button" class="tool" data-tool="storage" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9l9-5 9 5v11H3zM7 20v-7h10v7M7 16h10" /></svg>
          <span>Lager</span><kbd>3</kbd>
        </button>
        <button type="button" class="tool" data-tool="furnace" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16V9H4zM15 9V3h3v6M8 20v-5a4 4 0 0 1 8 0v5" /></svg>
          <span>Ofen</span><kbd>4</kbd>
        </button>
        <button type="button" class="tool" data-tool="assembler" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 20V5h14v15M5 9h14M10 9v4h4V9M8 17h8" /></svg>
          <span>Presse</span><kbd>5</kbd>
        </button>
        <button type="button" class="tool" data-tool="remove" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13" /></svg>
          <span>Abriss</span><kbd>X</kbd>
        </button>
        <button type="button" class="tool" id="rotate">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2-5M19 4v4h-4" /></svg>
          <span>Drehen</span><kbd>R</kbd>
        </button>
      </nav>
      <footer class="hud hud-help" id="help"></footer>
      <div class="tree" id="tree" hidden>
        <section class="tree-box" role="dialog" aria-label="Forschungsbaum">
          <header class="tree-head">
            <h2>Forschungsbaum</h2>
            <p>Bezahlt wird mit Teilen aus dem Lager.</p>
            <button type="button" class="link" data-close>Schließen <kbd>Esc</kbd></button>
          </header>
          <div class="tree-scroll">
            <svg class="tree-lines" aria-hidden="true"></svg>
            <div class="tree-cols"></div>
          </div>
        </section>
      </div>
      <div class="toast" id="toast" role="status" hidden></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
